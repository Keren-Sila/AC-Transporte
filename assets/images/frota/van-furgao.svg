<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-van" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="orange-van" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6600"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg-van)"/>

  <rect x="0" y="400" width="800" height="100" fill="#0A0F1D"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#FF6600" stroke-width="4"/>
  <line x1="0" y1="450" x2="800" y2="450" stroke="#475569" stroke-width="3" stroke-dasharray="30 20"/>

  <!-- High-Roof Cargo Van (Van Furgão) Full Size -->
  <g transform="translate(100, 150)">
    <path d="M 0 40 L 320 40 L 440 90 L 480 140 L 480 230 L 0 230 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3"/>
    <rect x="0" y="110" width="370" height="30" fill="url(#orange-van)"/>
    <text x="180" y="131" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16" letter-spacing="2" text-anchor="middle">AC TRANSPORTE • FURGÃO</text>

    <!-- Side Door Seam -->
    <line x1="160" y1="40" x2="160" y2="230" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="175" y="150" width="25" height="8" rx="2" fill="#475569"/>

    <!-- Windshield -->
    <polygon points="340,55 425,100 455,135 340,135" fill="#0A0F1D" opacity="0.85"/>
    <circle cx="468" cy="180" r="7" fill="#FFEA00"/>

    <!-- Wheels -->
    <circle cx="90" cy="230" r="30" fill="#0F172A" stroke="#475569" stroke-width="6"/>
    <circle cx="90" cy="230" r="12" fill="#94A3B8"/>

    <circle cx="390" cy="230" r="30" fill="#0F172A" stroke="#475569" stroke-width="6"/>
    <circle cx="390" cy="230" r="12" fill="#94A3B8"/>
  </g>

  <rect x="30" y="30" width="200" height="40" rx="20" fill="#0A0F1D" opacity="0.9" stroke="#FF6600" stroke-width="2"/>
  <text x="130" y="55" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" text-anchor="middle">VAN FURGÃO</text>
</svg>

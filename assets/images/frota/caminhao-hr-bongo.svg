<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-hr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="orange-hr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6600"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg-hr)"/>

  <rect x="0" y="400" width="800" height="100" fill="#0A0F1D"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#FF6600" stroke-width="4"/>
  <line x1="0" y1="450" x2="800" y2="450" stroke="#475569" stroke-width="3" stroke-dasharray="30 20"/>

  <!-- Compact HR / Bongo Box Truck Full Size -->
  <g transform="translate(110, 150)">
    <rect x="0" y="20" width="320" height="200" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3"/>
    <rect x="0" y="100" width="320" height="30" fill="url(#orange-hr)"/>
    <text x="160" y="121" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="15" letter-spacing="1" text-anchor="middle">AC TRANSPORTE • COMPACTO</text>

    <!-- Aerodynamic Wind Deflector + Cab -->
    <path d="M 320 20 L 380 70 L 450 70 L 480 120 L 480 220 L 320 220 Z" fill="#FF6600"/>
    <polygon points="390,85 440,85 465,125 390,125" fill="#0A0F1D" opacity="0.85"/>
    <circle cx="470" cy="175" r="7" fill="#FFEA00"/>

    <!-- Wheels -->
    <circle cx="80" cy="220" r="28" fill="#0F172A" stroke="#475569" stroke-width="6"/>
    <circle cx="80" cy="220" r="11" fill="#94A3B8"/>

    <circle cx="410" cy="220" r="28" fill="#0F172A" stroke="#475569" stroke-width="6"/>
    <circle cx="410" cy="220" r="11" fill="#94A3B8"/>
  </g>

  <rect x="30" y="30" width="220" height="40" rx="20" fill="#0A0F1D" opacity="0.9" stroke="#FF6600" stroke-width="2"/>
  <text x="140" y="55" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" text-anchor="middle">HR / BONGO BAÚ</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="hero-sky-v3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C15"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="hero-orange-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6600"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#hero-sky-v3)"/>

  <!-- Speed Grid Lines -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="15 15" opacity="0.4">
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="580" x2="1200" y2="580"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
  </g>

  <!-- Asphalt Road -->
  <polygon points="0,700 1200,700 1200,500 0,540" fill="#0A0F1D"/>
  <line x1="0" y1="620" x2="1200" y2="600" stroke="#FF6600" stroke-width="5" stroke-dasharray="40 25"/>

  <!-- AC Transporte Semi-Truck Graphic -->
  <g transform="translate(250, 240)">
    <!-- Trailer -->
    <rect x="0" y="50" width="480" height="200" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <rect x="0" y="130" width="480" height="35" fill="url(#hero-orange-glow)"/>
    <text x="240" y="155" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="20" letter-spacing="3" text-anchor="middle">AC TRANSPORTE LTDA</text>
    
    <!-- Cabin -->
    <path d="M 480 100 L 580 100 L 630 150 L 630 250 L 480 250 Z" fill="#FF6600"/>
    <polygon points="530,115 580,115 615,155 530,155" fill="#0A0F1D" opacity="0.85"/>
    
    <!-- Headlight beam -->
    <circle cx="625" cy="210" r="12" fill="#FFEA00"/>
    <polygon points="625,210 950,170 950,260 625,210" fill="#FFEA00" opacity="0.18"/>

    <!-- Heavy Wheels -->
    <circle cx="100" cy="250" r="34" fill="#0F172A" stroke="#475569" stroke-width="8"/>
    <circle cx="100" cy="250" r="14" fill="#94A3B8"/>

    <circle cx="210" cy="250" r="34" fill="#0F172A" stroke="#475569" stroke-width="8"/>
    <circle cx="210" cy="250" r="14" fill="#94A3B8"/>

    <circle cx="410" cy="250" r="34" fill="#0F172A" stroke="#475569" stroke-width="8"/>
    <circle cx="410" cy="250" r="14" fill="#94A3B8"/>

    <circle cx="560" cy="250" r="34" fill="#0F172A" stroke="#475569" stroke-width="8"/>
    <circle cx="560" cy="250" r="14" fill="#94A3B8"/>
  </g>
</svg>

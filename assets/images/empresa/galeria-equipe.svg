    <text x="240" y="132" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="18" letter-spacing="3" text-anchor="middle">AC TRANSPORTE LTDA</text>
    
    <path d="M 480 90 L 570 90 L 610 130 L 610 210 L 480 210 Z" fill="#FF6600"/>

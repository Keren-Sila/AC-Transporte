<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-op-v3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg-op-v3)"/>

  <!-- Blueprint / Grid lines overlay -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="10 10" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
  </g>

  <!-- Custom Operations Hub Diagram -->
  <g transform="translate(240, 200)">
    <rect x="0" y="0" width="320" height="180" rx="12" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <rect x="20" y="20" width="280" height="40" rx="6" fill="#0F172A"/>
    <text x="40" y="46" fill="#FF6600" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14">DEDICADO &amp; PERSONALIZADO</text>
    <text x="40" y="95" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">• Operação logística dedicada</text>
    <text x="40" y="125" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">• Rotas e horários exclusivos</text>
    <text x="40" y="155" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">• Monitoramento contínuo</text>
  </g>

  <!-- Badge Tag -->
  <rect x="40" y="40" width="260" height="44" rx="22" fill="#0A0F1D" opacity="0.9" stroke="#FF6600" stroke-width="2"/>
  <text x="170" y="67" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" text-anchor="middle">OPERAÇÕES PERSONALIZADAS</text>
</svg>

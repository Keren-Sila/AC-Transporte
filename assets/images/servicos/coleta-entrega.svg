  <!-- Badge Tag -->
  <rect x="40" y="40" width="220" height="44" rx="22" fill="#0A0F1D" opacity="0.9" stroke="#FF6600" stroke-width="2"/>
  <text x="150" y="67" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" text-anchor="middle">COLETA &amp; ENTREGA</text>

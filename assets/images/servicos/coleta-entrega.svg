    <rect x="20" y="200" width="30" height="15" fill="#451A03"/>
    <rect x="95" y="200" width="30" height="15" fill="#451A03"/>
    <rect x="170" y="200" width="30" height="15" fill="#451A03"/>

    <rect x="10" y="40" width="200" height="140" fill="url(#orange-box-v3)" rx="8" stroke="#FFFFFF" stroke-width="2"/>
    <text x="110" y="100" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="20" text-anchor="middle">AC LOG</text>
    <text x="110" y="130" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="middle" opacity="0.8">COLETA &amp; ENTREGA</text>

    <rect x="250" y="90" width="160" height="110" fill="#334155" rx="6" stroke="#FF6600" stroke-width="2"/>

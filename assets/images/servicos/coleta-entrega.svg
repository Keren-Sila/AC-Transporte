      <circle cx="40" cy="150" r="20" fill="#0F172A" stroke="#94A3B8" stroke-width="4"/>
      <circle cx="150" cy="150" r="20" fill="#0F172A" stroke="#94A3B8" stroke-width="4"/>
    </g>

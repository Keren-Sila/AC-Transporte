      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="orange-box-v3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6600"/>
      <stop offset="100%" stop-color="#D95300"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg-ce-v3)"/>

  <!-- Cargo Boxes & Pallets -->
  <g transform="translate(120, 260)">
